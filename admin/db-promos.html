<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codes Promo — Admin Archiclick</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #C9A961; --gold-light: #E5D4A8; --black: #0D0D0D;
    --black-soft: #1A1A1A; --black-card: #161616; --grey-text: #A8A8A8;
    --error: #D96C6C; --success: #7FB88A; --warning: #D9B76C; --border: rgba(201,169,97,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { width:100%; max-width:100%; overflow-x:hidden; }
  body { font-family:'Inter',sans-serif; background:var(--black); color:#fff; display:flex; min-height:100vh; width:100%; max-width:100%; overflow-x:hidden; }
  img, table, canvas { max-width:100%; }

  .sidebar { width:240px; background:var(--black-soft); border-right:1px solid var(--border); padding:28px 0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; overflow-x:hidden; transition:width 0.25s ease; z-index:120; }
  .sidebar .logo { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; text-align:center; letter-spacing:1px; color:var(--gold-light); margin-bottom:32px; padding:0 20px; white-space:nowrap; overflow:hidden; }
  .sidebar .logo span { color:var(--gold); }
  .sidebar .logo .logo-mini-collapsed { display:none; }
  .nav-item { display:flex; align-items:center; padding:12px 24px; color:var(--grey-text); text-decoration:none; font-size:13px; letter-spacing:0.5px; border-left:2px solid transparent; transition:all 0.15s; white-space:nowrap; }
  .nav-item i { width:18px; text-align:center; margin-right:12px; font-size:14px; flex-shrink:0; }
  .nav-item:hover { background:rgba(201,169,97,0.06); color:var(--gold-light); }
  .nav-item.active { color:var(--gold); border-left-color:var(--gold); background:rgba(201,169,97,0.08); }

  .sidebar-collapse-btn {
    display:none; position:absolute; top:24px; right:-13px; width:26px; height:26px;
    background:var(--black-soft); border:1px solid var(--border); border-radius:50%;
    color:var(--gold-light); font-size:11px; cursor:pointer; align-items:center; justify-content:center;
    z-index:10; transition:transform 0.25s ease;
  }
  .sidebar-collapse-btn:hover { border-color:var(--gold); color:var(--gold); }
  @media (min-width:901px) { .sidebar-collapse-btn { display:flex; } }

  .sidebar.collapsed { width:72px; }
  .sidebar.collapsed .logo .logo-full { display:none; }
  .sidebar.collapsed .logo .logo-mini-collapsed { display:inline; }
  .sidebar.collapsed .logo { padding:0; }
  .sidebar.collapsed .nav-item { padding:12px 0; justify-content:center; }
  .sidebar.collapsed .nav-item i { margin-right:0; font-size:16px; }
  .sidebar.collapsed .nav-text { display:none; }
  .sidebar.collapsed .sidebar-collapse-btn { transform:rotate(180deg); }

  .main { margin-left:240px; flex:1; padding:32px 40px; min-width:0; max-width:100%; transition:margin-left 0.25s ease; }
  body.sidebar-collapsed .main { margin-left:72px; }
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .page-header h1 { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; }

  .filters { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .filter-btn { background:var(--black-card); border:1px solid var(--border); color:var(--grey-text); padding:8px 16px; border-radius:20px; font-size:12px; cursor:pointer; }
  .filter-btn.active { background:var(--gold); color:var(--black); border-color:var(--gold); font-weight:600; }
  .filter-btn:hover:not(.active) { border-color:var(--gold); color:var(--gold-light); }

  .btn { padding:10px 18px; border-radius:2px; border:none; font-size:12px; font-weight:600; letter-spacing:0.5px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-gold { background:var(--gold); color:var(--black); }
  .btn-gold:hover { background:var(--gold-light); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--grey-text); }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold-light); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .table-wrap { background:var(--black-card); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:14px 16px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); border-bottom:1px solid var(--border); background:rgba(201,169,97,0.04); }
  td { padding:14px 16px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.05); color:#ddd; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,255,255,0.02); }

  .code-cell { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:1px; color:var(--gold-light); }
  .copy-btn { background:none; border:none; color:var(--grey-text); cursor:pointer; font-size:13px; }
  .copy-btn:hover { color:var(--gold); }

  .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-size:11px; }
  .badge.actif { background:rgba(127,184,138,0.15); color:var(--success); }
  .badge.inactif { background:rgba(217,183,108,0.15); color:var(--warning); }
  .badge.expire { background:rgba(217,108,108,0.15); color:var(--error); }

  .icon-btn { background:none; border:1px solid var(--border); color:var(--grey-text); padding:6px 10px; border-radius:2px; cursor:pointer; font-size:12px; margin-right:4px; }
  .icon-btn:hover { color:var(--gold-light); border-color:var(--gold); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--grey-text); }

  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--black-soft); border:1px solid var(--border); border-radius:4px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:28px; }
  .modal h2 { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold-light); margin-bottom:18px; }

  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group { margin-bottom:14px; }
  label { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; }
  input, select { width:100%; background:#000; border:1px solid rgba(255,255,255,0.15); color:#fff; padding:9px 11px; font-family:'Inter',sans-serif; font-size:13px; border-radius:2px; }
  input:focus, select:focus { outline:none; border-color:var(--gold); }
  input#codeInput { text-transform:uppercase; letter-spacing:1px; font-weight:600; }

  .toggle-row { display:flex; align-items:center; gap:10px; }

  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--black-soft); border:1px solid var(--border); padding:14px 20px; border-radius:4px; font-size:13px; z-index:200; display:none; }
  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error { border-color:var(--error); color:var(--error); }

  /* ==================== RESPONSIVE MOBILE/TABLETTE ==================== */
  .mobile-topbar { display:none; }
  .sidebar-overlay { display:none; }

  .page-header, .filters, .modal-actions, .code-cell, .toggle-row { min-width:0; }

  @media (max-width: 1024px) {
    .main { padding:28px 24px; }
  }

  @media (max-width: 900px) {
    .mobile-topbar {
      display:flex; align-items:center; justify-content:space-between;
      position:fixed; top:0; left:0; right:0; height:56px;
      background:var(--black-soft); border-bottom:1px solid var(--border);
      padding:0 16px; z-index:150;
    }
    .mobile-topbar .logo-mini { font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold-light); }
    .mobile-topbar .logo-mini span { color:var(--gold); }
    .menu-toggle-btn { background:none; border:1px solid var(--border); color:var(--gold-light); padding:8px 12px; border-radius:3px; font-size:15px; cursor:pointer; }

    .sidebar { width:80%; max-width:280px; transform:translateX(-100%); transition:transform 0.3s ease; top:56px; z-index:140; }
    .sidebar.open { transform:translateX(0); }
    .sidebar.collapsed { width:80%; max-width:280px; }
    .sidebar.collapsed .logo .logo-full { display:inline; }
    .sidebar.collapsed .logo .logo-mini-collapsed { display:none; }
    .sidebar.collapsed .nav-item { padding:12px 24px; justify-content:flex-start; }
    .sidebar.collapsed .nav-item i { margin-right:12px; }
    .sidebar.collapsed .nav-text { display:inline; }

    .sidebar-overlay.open {
      display:block; position:fixed; top:56px; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6); z-index:130;
    }

    body.sidebar-collapsed .main { margin-left:0; }
    .main { margin-left:0 !important; padding:72px 16px 24px !important; width:100%; }

    .page-header { flex-wrap:wrap; gap:10px; }
    .page-header h1 { font-size:22px; }
    .filters { gap:8px; }

    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { min-width:640px; }

    .form-row { grid-template-columns:1fr !important; }
    .modal { padding:20px; max-height:88vh; }
    .modal-actions { flex-wrap:wrap; }
    .modal-actions .btn { flex:1 1 auto; }

    .toast { left:16px; right:16px; bottom:16px; }
  }

  @media (max-width: 480px) {
    .page-header h1 { font-size:20px; }
    .page-header .btn { width:100%; }
    .filter-btn { font-size:11px; padding:7px 12px; }
    .modal { padding:16px; }
    .modal h2 { font-size:20px; }
    .code-cell { font-size:12px; }
  }

</style>
</head>
<body>

<div class="mobile-topbar">
  <div class="logo-mini">Archi<span>click</span></div>
  <button class="menu-toggle-btn" id="menuToggleBtn">☰ Menu</button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggleBtn = document.getElementById('menuToggleBtn');
  var overlay = document.getElementById('sidebarOverlay');
  var sidebar = document.querySelector('.sidebar');
  if (toggleBtn) toggleBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); overlay.classList.toggle('open'); });
  if (overlay) overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  document.querySelectorAll('.sidebar .nav-item').forEach(function(link) {
    link.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  });

  /* Rétractation de la sidebar (icônes seules), état mémorisé */
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  var isCollapsed = localStorage.getItem('archiclick_sidebar_collapsed') === '1';
  function applyCollapsedState() {
    sidebar.classList.toggle('collapsed', isCollapsed);
    document.body.classList.toggle('sidebar-collapsed', isCollapsed);
  }
  applyCollapsedState();
  if (collapseBtn) {
    collapseBtn.addEventListener('click', function() {
      isCollapsed = !isCollapsed;
      localStorage.setItem('archiclick_sidebar_collapsed', isCollapsed ? '1' : '0');
      applyCollapsedState();
    });
  }
});
</script>

  <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Réduire / agrandir le menu"><i class="fas fa-angle-left"></i></button>

</div>

<div class="main">
  <div class="page-header">
    <h1>Codes Promo</h1>
    <button class="btn btn-gold" id="addPromoBtn">+ Créer un code</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="tous">Tous</button>
    <button class="filter-btn" data-filter="actif">Actifs</button>
    <button class="filter-btn" data-filter="inactif">Inactifs</button>
    <button class="filter-btn" data-filter="expire">Expirés</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Code</th><th>Réduction</th><th>Validité</th><th>Statut</th><th>Actions</th></tr>
      </thead>
      <tbody id="promosTableBody">
        <tr><td colspan="5" class="empty-state">Chargement...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="promoModal">
  <div class="modal">
    <h2 id="modalTitle">Créer un code promo</h2>
    <form id="promoForm">
      <input type="hidden" id="promoId">

      <div class="form-group">
        <label>Code</label>
        <input type="text" id="codeInput" placeholder="EX: BIENVENUE10" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Type de réduction</label>
          <select id="typeReduction" required>
            <option value="%">Pourcentage (%)</option>
            <option value="fixe">Montant fixe (FCFA)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Valeur de la réduction</label>
          <input type="number" id="valeur" min="0" required>
        </div>
      </div>

      <div class="form-group">
        <label>Date d'expiration</label>
        <input type="date" id="dateFin" required>
      </div>

      <div class="form-group toggle-row">
        <label style="margin-bottom:0;">Statut</label>
        <select id="actif" style="width:auto;">
          <option value="true">Actif</option>
          <option value="false">Inactif</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/supabase.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/auth-guard.js"></script>
<script>
let allPromos = [];
let currentFilter = 'tous';
let isReadOnly = false;

document.addEventListener('adminReady', () => {
  isReadOnly = window.ADMIN.access('promos') !== 'full';
  if (isReadOnly) document.getElementById('addPromoBtn').style.display = 'none';
  loadPromos();
});

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

function getComputedStatus(promo) {
  const today = new Date().toISOString().split('T')[0];
  if (promo.date_expiration && promo.date_expiration < today) return 'expire';
  return promo.actif ? 'actif' : 'inactif';
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPromos();
  });
});

// ---------- CHARGEMENT (tri par id, "created_at" n'existe pas sur cette table) ----------
async function loadPromos() {
  const { data, error } = await supabase.from('promos').select('*').order('id', { ascending: false });
  if (error) {
    document.getElementById('promosTableBody').innerHTML = `<tr><td colspan="5" class="empty-state">Erreur : ${error.message}</td></tr>`;
    return;
  }
  allPromos = data || [];
  renderPromos();
}

function renderPromos() {
  const tbody = document.getElementById('promosTableBody');
  const filtered = currentFilter === 'tous' ? allPromos : allPromos.filter(p => getComputedStatus(p) === currentFilter);
  const statusLabels = { actif: 'Actif', inactif: 'Inactif', expire: 'Expiré' };

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun code promo pour ce filtre.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const status = getComputedStatus(p);
    const reduction = p.type === '%' ? `${p.reduction}%` : `${Number(p.reduction).toLocaleString('fr-FR')} FCFA`;

    return `
      <tr>
        <td>
          <div class="code-cell">
            ${escapeHtml(p.code)}
            <button class="copy-btn" data-code="${escapeHtml(p.code)}" title="Copier le code">📋</button>
          </div>
        </td>
        <td>${reduction}</td>
        <td>Expire le ${new Date(p.date_expiration).toLocaleDateString('fr-FR')}</td>
        <td><span class="badge ${status}">${statusLabels[status]}</span></td>
        <td>
          ${!isReadOnly ? `
            <button class="icon-btn edit-btn" data-id="${p.id}">Modifier</button>
            <button class="icon-btn duplicate-btn" data-id="${p.id}">Dupliquer</button>
            <button class="icon-btn delete-btn" data-id="${p.id}" style="color:var(--error);">Suppr.</button>
          ` : '—'}
        </td>
      </tr>
    `;
  }).join('');

  document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', () => {
    navigator.clipboard.writeText(btn.dataset.code);
    showToast('Code copié : ' + btn.dataset.code, 'success');
  }));

  if (!isReadOnly) {
    document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
    document.querySelectorAll('.duplicate-btn').forEach(btn => btn.addEventListener('click', () => duplicatePromo(btn.dataset.id)));
    document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deletePromo(btn.dataset.id)));
  }
}

const modal = document.getElementById('promoModal');
const form = document.getElementById('promoForm');

document.getElementById('addPromoBtn').addEventListener('click', () => {
  form.reset();
  document.getElementById('modalTitle').textContent = 'Créer un code promo';
  document.getElementById('promoId').value = '';
  modal.classList.add('open');
});

document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('open'));

function openModal(id) {
  const p = allPromos.find(x => x.id == id);
  if (!p) return;

  document.getElementById('modalTitle').textContent = 'Modifier le code promo';
  document.getElementById('promoId').value = p.id;
  document.getElementById('codeInput').value = p.code;
  document.getElementById('typeReduction').value = p.type;
  document.getElementById('valeur').value = p.reduction;
  document.getElementById('dateFin').value = p.date_expiration;
  document.getElementById('actif').value = String(p.actif);

  modal.classList.add('open');
}

function duplicatePromo(id) {
  const p = allPromos.find(x => x.id == id);
  if (!p) return;

  form.reset();
  document.getElementById('modalTitle').textContent = 'Dupliquer le code promo';
  document.getElementById('promoId').value = '';
  document.getElementById('codeInput').value = p.code + '-COPIE';
  document.getElementById('typeReduction').value = p.type;
  document.getElementById('valeur').value = p.reduction;
  document.getElementById('dateFin').value = p.date_expiration;
  document.getElementById('actif').value = 'true';

  modal.classList.add('open');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';

  const data = {
    code: document.getElementById('codeInput').value.trim().toUpperCase(),
    type: document.getElementById('typeReduction').value,
    reduction: parseFloat(document.getElementById('valeur').value),
    date_expiration: document.getElementById('dateFin').value,
    actif: document.getElementById('actif').value === 'true'
  };

  const id = document.getElementById('promoId').value;
  let error;
  if (id) {
    ({ error } = await supabase.from('promos').update(data).eq('id', id));
  } else {
    ({ error } = await supabase.from('promos').insert([data]));
  }

  btn.disabled = false; btn.textContent = 'Enregistrer';

  if (error) {
    if (error.message.includes('duplicate') || error.message.includes('unique')) {
      showToast("Ce code existe déjà. Choisis-en un autre.", 'error');
    } else {
      showToast("Erreur : " + error.message, 'error');
    }
    return;
  }

  showToast(id ? 'Code promo modifié.' : 'Code promo créé.', 'success');
  modal.classList.remove('open');
  loadPromos();
});

async function deletePromo(id) {
  if (!confirm('Supprimer ce code promo définitivement ?')) return;
  const { error } = await supabase.from('promos').delete().eq('id', id);
  if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
  showToast('Code promo supprimé.', 'success');
  loadPromos();
}
</script>

</body>
