<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tâches — Admin Archiclick</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --gold: #C9A961; --gold-light: #E5D4A8; --black: #0D0D0D;
    --black-soft: #1A1A1A; --black-card: #161616; --grey-text: #A8A8A8;
    --error: #D96C6C; --success: #7FB88A; --warning: #D9B76C; --border: rgba(201,169,97,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--black); color:#fff; display:flex; min-height:100vh; }

  .sidebar { width:240px; background:var(--black-soft); border-right:1px solid var(--border); padding:28px 0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; }
  .sidebar .logo { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; text-align:center; letter-spacing:1px; color:var(--gold-light); margin-bottom:32px; padding:0 20px; }
  .sidebar .logo span { color:var(--gold); }
  .nav-item { display:block; padding:12px 24px; color:var(--grey-text); text-decoration:none; font-size:13px; letter-spacing:0.5px; border-left:2px solid transparent; transition:all 0.15s; }
  .nav-item:hover { background:rgba(201,169,97,0.06); color:var(--gold-light); }
  .nav-item.active { color:var(--gold); border-left-color:var(--gold); background:rgba(201,169,97,0.08); }

  .main { margin-left:240px; flex:1; padding:32px 40px; }
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .page-header h1 { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; }

  .filters { display:flex; gap:10px; margin-bottom:20px; }
  .filter-btn { background:var(--black-card); border:1px solid var(--border); color:var(--grey-text); padding:8px 16px; border-radius:20px; font-size:12px; cursor:pointer; }
  .filter-btn.active { background:var(--gold); color:var(--black); border-color:var(--gold); font-weight:600; }
  .filter-btn:hover:not(.active) { border-color:var(--gold); color:var(--gold-light); }

  .btn { padding:10px 18px; border-radius:2px; border:none; font-size:12px; font-weight:600; letter-spacing:0.5px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-gold { background:var(--gold); color:var(--black); }
  .btn-gold:hover { background:var(--gold-light); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--grey-text); }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold-light); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .kanban { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; align-items:start; }

  .kanban-col { background:var(--black-card); border:1px solid var(--border); border-radius:4px; padding:16px; min-height:200px; }
  .kanban-col-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .kanban-col-header h2 { font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--gold-light); }
  .col-count { background:rgba(201,169,97,0.15); color:var(--gold-light); font-size:11px; padding:2px 9px; border-radius:10px; }

  .task-card {
    background:#000; border:1px solid rgba(255,255,255,0.08); border-radius:4px;
    padding:14px; margin-bottom:12px; position:relative;
  }
  .task-card.priorite-haute { border-left:3px solid var(--error); }
  .task-card.priorite-moyenne { border-left:3px solid var(--warning); }
  .task-card.priorite-basse { border-left:3px solid var(--success); }

  .task-title { font-size:13px; font-weight:600; color:#fff; margin-bottom:6px; }
  .task-desc { font-size:12px; color:var(--grey-text); margin-bottom:10px; line-height:1.4; }
  .task-meta { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--grey-text); margin-bottom:10px; }
  .task-assignee { background:rgba(201,169,97,0.1); color:var(--gold-light); padding:2px 8px; border-radius:10px; }
  .task-overdue { color:var(--error); font-weight:600; }

  .task-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .task-actions button {
    background:none; border:1px solid var(--border); color:var(--grey-text);
    padding:5px 8px; border-radius:2px; cursor:pointer; font-size:10px;
  }
  .task-actions button:hover { color:var(--gold-light); border-color:var(--gold); }
  .task-actions .delete-task-btn:hover { color:var(--error); border-color:var(--error); }

  .empty-col { text-align:center; padding:30px 10px; color:var(--grey-text); font-size:12px; }

  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--black-soft); border:1px solid var(--border); border-radius:4px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:28px; }
  .modal h2 { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold-light); margin-bottom:18px; }

  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group { margin-bottom:14px; }
  label { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; }
  input, select, textarea { width:100%; background:#000; border:1px solid rgba(255,255,255,0.15); color:#fff; padding:9px 11px; font-family:'Inter',sans-serif; font-size:13px; border-radius:2px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
  textarea { min-height:70px; resize:vertical; }

  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--black-soft); border:1px solid var(--border); padding:14px 20px; border-radius:4px; font-size:13px; z-index:200; display:none; }
  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error { border-color:var(--error); color:var(--error); }

  @media (max-width: 1000px) { .kanban { grid-template-columns:1fr; } }

  /* ==================== RESPONSIVE MOBILE/TABLETTE ==================== */
  .mobile-topbar { display:none; }
  .sidebar-overlay { display:none; }

  @media (max-width: 900px) {
    .mobile-topbar {
      display:flex; align-items:center; justify-content:space-between;
      position:fixed; top:0; left:0; right:0; height:56px;
      background:var(--black-soft); border-bottom:1px solid var(--border);
      padding:0 16px; z-index:150;
    }
    .mobile-topbar .logo-mini { font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold-light); }
    .mobile-topbar .logo-mini span { color:var(--gold); }
    .menu-toggle-btn { background:none; border:1px solid var(--border); color:var(--gold-light); padding:8px 12px; border-radius:3px; font-size:15px; cursor:pointer; }

    .sidebar { transform:translateX(-100%); transition:transform 0.3s ease; top:56px; z-index:140; }
    .sidebar.open { transform:translateX(0); }

    .sidebar-overlay.open {
      display:block; position:fixed; top:56px; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6); z-index:130;
    }

    .main { margin-left:0 !important; padding:76px 16px 24px !important; }
    .stats-grid { grid-template-columns:1fr 1fr !important; }
    .table-wrap { overflow-x:auto; }
    table { min-width:640px; }
    .form-row { grid-template-columns:1fr !important; }
    .page-header { flex-wrap:wrap; }
  }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns:1fr !important; }
  }

</style>
</head>
<body>

<div class="mobile-topbar">
  <div class="logo-mini">Archi<span>click</span></div>
  <button class="menu-toggle-btn" id="menuToggleBtn">☰ Menu</button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggleBtn = document.getElementById('menuToggleBtn');
  var overlay = document.getElementById('sidebarOverlay');
  var sidebar = document.querySelector('.sidebar');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });
  }
  document.querySelectorAll('.sidebar .nav-item').forEach(function(link) {
    link.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });
  });
});
</script>

<div class="sidebar">
  <div class="logo">Archi<span>click</span></div>
  <a href="dashboard.html" class="nav-item" data-page="dashboard">Tableau de bord</a>
  <a href="db-plans.html" class="nav-item" data-page="plans">Plans</a>
  <a href="db-commandes.html" class="nav-item" data-page="commandes">Commandes</a>
  <a href="db-clients.html" class="nav-item" data-page="clients">Clients</a>
  <a href="db-avis.html" class="nav-item" data-page="avis">Avis clients</a>
  <a href="db-demandes.html" class="nav-item" data-page="demandes">Demandes sur mesure</a>
  <a href="db-promos.html" class="nav-item" data-page="promos">Codes Promo</a>
  <a href="db-blog.html" class="nav-item" data-page="blog">Blog</a>
  <a href="db-comptabilite.html" class="nav-item" data-page="comptabilite">Comptabilité</a>
  <a href="db-taches.html" class="nav-item active" data-page="taches">Tâches</a>
  <a href="db-parametres.html" class="nav-item" data-page="parametres">Paramètres</a>
  <a href="db-admins.html" class="nav-item" data-page="admins">Gestion des admins</a>
  <a href="#" id="logoutBtn" class="nav-item" style="margin-top:20px; color:var(--error);">Déconnexion</a>
</div>

<div class="main">
  <div class="page-header">
    <h1>Tâches internes</h1>
    <button class="btn btn-gold" id="addTaskBtn">+ Nouvelle tâche</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="toutes">Toutes les tâches</button>
    <button class="filter-btn" data-filter="mes-taches">Mes tâches</button>
  </div>

  <div class="kanban">
    <div class="kanban-col">
      <div class="kanban-col-header"><h2>À faire</h2><span class="col-count" id="countAFaire">0</span></div>
      <div id="colAFaire"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-header"><h2>En cours</h2><span class="col-count" id="countEnCours">0</span></div>
      <div id="colEnCours"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-header"><h2>Terminé</h2><span class="col-count" id="countTermine">0</span></div>
      <div id="colTermine"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="modalTitle">Nouvelle tâche</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">

      <div class="form-group">
        <label>Titre</label>
        <input type="text" id="titre" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Priorité</label>
          <select id="priorite">
            <option value="basse">Basse</option>
            <option value="moyenne" selected>Moyenne</option>
            <option value="haute">Haute</option>
          </select>
        </div>
        <div class="form-group">
          <label>Échéance</label>
          <input type="date" id="dateEcheance">
        </div>
      </div>

      <div class="form-group">
        <label>Assigner à</label>
        <select id="assigneA"></select>
      </div>

      <div class="form-group">
        <label>Statut</label>
        <select id="statut">
          <option value="a_faire">À faire</option>
          <option value="en_cours">En cours</option>
          <option value="termine">Terminé</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/supabase.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/auth-guard.js"></script>
<script>
let allTasks = [];
let allAdmins = [];
let currentFilter = 'toutes';

document.addEventListener('adminReady', async () => {
  await loadAdminsList();
  loadTasks();
});

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

// ---------- LISTE DES ADMINS POUR L'ASSIGNATION ----------
async function loadAdminsList() {
  const { data } = await supabase.from('admins').select('nom, email').order('nom', { ascending: true });
  allAdmins = data || [];
  const select = document.getElementById('assigneA');
  select.innerHTML = '<option value="">Non assignée</option>' +
    allAdmins.map(a => `<option value="${escapeHtml(a.nom)}">${escapeHtml(a.nom)}</option>`).join('');
}

// ---------- FILTRES ----------
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTasks();
  });
});

// ---------- CHARGEMENT ----------
async function loadTasks() {
  const { data, error } = await supabase.from('taches').select('*').order('date_echeance', { ascending: true, nullsFirst: false });
  if (error) {
    console.error(error);
    showToast('Erreur de chargement : ' + error.message, 'error');
    return;
  }
  allTasks = data || [];
  renderTasks();
}

function isOverdue(task) {
  if (!task.date_echeance || task.statut === 'termine') return false;
  return task.date_echeance < new Date().toISOString().split('T')[0];
}

function renderTasks() {
  const myName = window.ADMIN.nom;
  let filtered = currentFilter === 'mes-taches' ? allTasks.filter(t => t.assigne_a === myName) : allTasks;

  const cols = { a_faire: [], en_cours: [], termine: [] };
  filtered.forEach(t => { if (cols[t.statut]) cols[t.statut].push(t); });

  document.getElementById('countAFaire').textContent = cols.a_faire.length;
  document.getElementById('countEnCours').textContent = cols.en_cours.length;
  document.getElementById('countTermine').textContent = cols.termine.length;

  renderColumn('colAFaire', cols.a_faire, 'a_faire');
  renderColumn('colEnCours', cols.en_cours, 'en_cours');
  renderColumn('colTermine', cols.termine, 'termine');
}

function renderColumn(containerId, tasks, statutKey) {
  const container = document.getElementById(containerId);
  if (tasks.length === 0) {
    container.innerHTML = `<div class="empty-col">Aucune tâche ici.</div>`;
    return;
  }

  const nextStatut = { a_faire: 'en_cours', en_cours: 'termine', termine: null };
  const nextLabel = { a_faire: 'Démarrer →', en_cours: 'Terminer →', termine: null };

  container.innerHTML = tasks.map(t => {
    const overdue = isOverdue(t);
    return `
      <div class="task-card priorite-${t.priorite}">
        <div class="task-title">${escapeHtml(t.titre)}</div>
        ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ''}
        <div class="task-meta">
          <span class="task-assignee">${escapeHtml(t.assigne_a || 'Non assignée')}</span>
          <span class="${overdue ? 'task-overdue' : ''}">
            ${t.date_echeance ? new Date(t.date_echeance).toLocaleDateString('fr-FR') : ''}
            ${overdue ? ' ⚠ En retard' : ''}
          </span>
        </div>
        <div class="task-actions">
          <button class="edit-task-btn" data-id="${t.id}">Modifier</button>
          ${nextStatut[statutKey] ? `<button class="advance-task-btn" data-id="${t.id}" data-next="${nextStatut[statutKey]}">${nextLabel[statutKey]}</button>` : ''}
          <button class="delete-task-btn" data-id="${t.id}">Suppr.</button>
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.edit-task-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
  container.querySelectorAll('.delete-task-btn').forEach(btn => btn.addEventListener('click', () => deleteTask(btn.dataset.id)));
  container.querySelectorAll('.advance-task-btn').forEach(btn => btn.addEventListener('click', () => advanceTask(btn.dataset.id, btn.dataset.next)));
}

async function advanceTask(id, nextStatut) {
  const { error } = await supabase.from('taches').update({ statut: nextStatut }).eq('id', id);
  if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
  loadTasks();
}

// ---------- MODAL ----------
const modal = document.getElementById('taskModal');
const form = document.getElementById('taskForm');

document.getElementById('addTaskBtn').addEventListener('click', () => {
  form.reset();
  document.getElementById('modalTitle').textContent = 'Nouvelle tâche';
  document.getElementById('taskId').value = '';
  modal.classList.add('open');
});

document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('open'));

function openEditModal(id) {
  const t = allTasks.find(x => x.id == id);
  if (!t) return;

  document.getElementById('modalTitle').textContent = 'Modifier la tâche';
  document.getElementById('taskId').value = t.id;
  document.getElementById('titre').value = t.titre;
  document.getElementById('description').value = t.description || '';
  document.getElementById('priorite').value = t.priorite || 'moyenne';
  document.getElementById('dateEcheance').value = t.date_echeance || '';
  document.getElementById('assigneA').value = t.assigne_a || '';
  document.getElementById('statut').value = t.statut || 'a_faire';

  modal.classList.add('open');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';

  const data = {
    titre: document.getElementById('titre').value.trim(),
    description: document.getElementById('description').value.trim(),
    priorite: document.getElementById('priorite').value,
    date_echeance: document.getElementById('dateEcheance').value || null,
    assigne_a: document.getElementById('assigneA').value || null,
    statut: document.getElementById('statut').value
  };

  const id = document.getElementById('taskId').value;
  let error;
  if (id) {
    ({ error } = await supabase.from('taches').update(data).eq('id', id));
  } else {
    data.created_by = window.ADMIN.nom;
    data.created_at = new Date().toISOString();
    ({ error } = await supabase.from('taches').insert([data]));
  }

  btn.disabled = false; btn.textContent = 'Enregistrer';

  if (error) { showToast('Erreur : ' + error.message, 'error'); return; }

  showToast(id ? 'Tâche modifiée.' : 'Tâche créée.', 'success');
  modal.classList.remove('open');
  loadTasks();
});

async function deleteTask(id) {
  if (!confirm('Supprimer cette tâche définitivement ?')) return;
  const { error } = await supabase.from('taches').delete().eq('id', id);
  if (error) { showToast('Erreur : ' + error.message, 'error'); return; }
  showToast('Tâche supprimée.', 'success');
  loadTasks();
}
</script>

</body>
</html>
