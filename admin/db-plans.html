<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Plans — Admin Archiclick</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --gold: #C9A961;
    --gold-light: #E5D4A8;
    --black: #0D0D0D;
    --black-soft: #1A1A1A;
    --black-card: #161616;
    --grey-text: #A8A8A8;
    --error: #D96C6C;
    --success: #7FB88A;
    --border: rgba(201,169,97,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--black);
    color: #fff;
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    background: var(--black-soft);
    border-right: 1px solid var(--border);
    padding: 28px 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
  }

  .sidebar .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 1px;
    color: var(--gold-light);
    margin-bottom: 32px;
    padding: 0 20px;
  }
  .sidebar .logo span { color: var(--gold); }

  .nav-item {
    display: block;
    padding: 12px 24px;
    color: var(--grey-text);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.5px;
    border-left: 2px solid transparent;
    transition: all 0.15s;
  }

  .nav-item:hover { background: rgba(201,169,97,0.06); color: var(--gold-light); }

  .nav-item.active {
    color: var(--gold);
    border-left-color: var(--gold);
    background: rgba(201,169,97,0.08);
  }

  /* MAIN */
  .main {
    margin-left: 240px;
    flex: 1;
    padding: 32px 40px;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .page-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: #fff;
  }

  .btn {
    padding: 11px 22px;
    border-radius: 2px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .btn-gold { background: var(--gold); color: var(--black); }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--grey-text); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold-light); }
  .btn-danger { background: transparent; border: 1px solid rgba(217,108,108,0.4); color: var(--error); }
  .btn-danger:hover { background: rgba(217,108,108,0.1); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* TABLE */
  .table-wrap {
    background: var(--black-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left;
    padding: 14px 16px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-light);
    border-bottom: 1px solid var(--border);
    background: rgba(201,169,97,0.04);
  }

  td {
    padding: 14px 16px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #ddd;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .thumb {
    width: 48px; height: 48px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
  .badge.actif { background: rgba(127,184,138,0.15); color: var(--success); }
  .badge.inactif { background: rgba(217,108,108,0.15); color: var(--error); }

  .actions-cell { display: flex; gap: 8px; }
  .icon-btn {
    background: none; border: 1px solid var(--border);
    color: var(--grey-text); padding: 6px 10px;
    border-radius: 2px; cursor: pointer; font-size: 12px;
  }
  .icon-btn:hover { color: var(--gold-light); border-color: var(--gold); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--grey-text);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--black-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }

  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    color: var(--gold-light);
    margin-bottom: 24px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    background: #000;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    border-radius: 2px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { resize: vertical; min-height: 70px; }

  .checkbox-row { display: flex; gap: 20px; align-items: center; }
  .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; text-transform: none; letter-spacing: 0; color: #ddd; margin-bottom: 0; }
  .checkbox-row input[type="checkbox"] { width: auto; }

  .toggle-row { display: flex; align-items: center; gap: 10px; }

  .image-preview-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .image-preview-item { position: relative; }
  .image-preview-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); }
  .image-preview-item .remove-img {
    position: absolute; top: -6px; right: -6px;
    background: var(--error); color: #fff; border: none;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 11px; cursor: pointer; line-height: 1;
  }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

  .loader { text-align: center; padding: 40px; color: var(--grey-text); font-size: 13px; }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--black-soft);
    border: 1px solid var(--border);
    padding: 14px 20px;
    border-radius: 4px;
    font-size: 13px;
    z-index: 200;
    display: none;
  }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--error); color: var(--error); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">Archi<span>click</span></div>
  <a href="dashboard.html" class="nav-item" data-page="dashboard">Tableau de bord</a>
  <a href="db-plans.html" class="nav-item active" data-page="plans">Plans</a>
  <a href="db-commandes.html" class="nav-item" data-page="commandes">Commandes</a>
  <a href="db-clients.html" class="nav-item" data-page="clients">Clients</a>
  <a href="db-avis.html" class="nav-item" data-page="avis">Avis clients</a>
  <a href="db-demandes.html" class="nav-item" data-page="demandes">Demandes sur mesure</a>
  <a href="db-promos.html" class="nav-item" data-page="promos">Codes Promo</a>
  <a href="db-blog.html" class="nav-item" data-page="blog">Blog</a>
  <a href="db-comptabilite.html" class="nav-item" data-page="comptabilite">Comptabilité</a>
  <a href="db-taches.html" class="nav-item" data-page="taches">Tâches</a>
  <a href="db-parametres.html" class="nav-item" data-page="parametres">Paramètres</a>
  <a href="db-admins.html" class="nav-item" data-page="admins">Gestion des admins</a>
  <a href="#" id="logoutBtn" class="nav-item" style="margin-top: 20px; color: var(--error);">Déconnexion</a>
</div>

<div class="main">
  <div class="page-header">
    <h1>Gestion des Plans</h1>
    <button class="btn btn-gold" id="addPlanBtn">+ Ajouter un plan</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Réf.</th>
          <th>Image</th>
          <th>Titre</th>
          <th>Catégorie</th>
          <th>Prix</th>
          <th>Surface</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="plansTableBody">
        <tr><td colspan="8" class="loader">Chargement des plans...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL AJOUT/EDITION -->
<div class="modal-overlay" id="planModal">
  <div class="modal">
    <h2 id="modalTitle">Ajouter un plan</h2>
    <form id="planForm">
      <input type="hidden" id="planId">

      <div class="form-group full" id="referenceGroup" style="display:none;">
        <label>Référence (générée automatiquement)</label>
        <input type="text" id="reference" disabled style="opacity:0.7; letter-spacing:1px; font-weight:600;">
      </div>

      <div class="form-group full">
        <label>Titre du plan</label>
        <input type="text" id="titre" required>
      </div>

      <div class="form-group full">
        <label>Description</label>
        <textarea id="description" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prix (FCFA)</label>
          <input type="number" id="prix" min="0" required>
        </div>
        <div class="form-group">
          <label>Catégorie</label>
          <select id="categorie" required>
            <option value="villa">Villa</option>
            <option value="duplex">Duplex</option>
            <option value="appartement">Appartement</option>
            <option value="studio">Studio</option>
            <option value="immeuble">Immeuble</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Surface (m²)</label>
          <input type="number" id="surface" min="0" required>
        </div>
        <div class="form-group">
          <label>Nombre de chambres</label>
          <input type="number" id="chambres" min="0" required>
        </div>
      </div>

      <div class="form-group full">
        <label>Formats disponibles</label>
        <div class="checkbox-row">
          <label><input type="checkbox" id="formatPdf" value="PDF"> PDF</label>
          <label><input type="checkbox" id="formatDwg" value="DWG"> DWG</label>
        </div>
      </div>

      <div class="form-group full">
        <label>Images du plan</label>
        <input type="file" id="imagesInput" accept="image/*" multiple>
        <div class="image-preview-list" id="imagePreviewList"></div>
      </div>

      <div class="form-group full toggle-row">
        <label style="margin-bottom:0;">Statut</label>
        <select id="statut" style="width: auto;">
          <option value="actif">Actif (visible sur le catalogue)</option>
          <option value="inactif">Inactif (masqué)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/supabase.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/auth-guard.js"></script>
<script>
const BUCKET = 'plans-images';
let currentImages = []; // URLs déjà enregistrées pour le plan en cours d'édition
let newFiles = [];      // Nouveaux fichiers à uploader
let isReadOnly = false; // true si le rôle de l'admin n'a que la lecture sur "plans"

const CATEGORIE_ABBR = {
  villa: 'VIL',
  duplex: 'DUP',
  appartement: 'APP',
  studio: 'STU',
  immeuble: 'IMM'
};

// Génère une référence du type VIL-2607-001 (catégorie - année/mois - séquence)
async function generateReference(categorie) {
  const abbr = CATEGORIE_ABBR[categorie] || 'PLN';
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const prefix = `${abbr}-${yy}${mm}-`;

  const { data, error } = await supabase
    .from('plans')
    .select('reference')
    .like('reference', `${prefix}%`)
    .order('reference', { ascending: false })
    .limit(1);

  let nextSeq = 1;
  if (!error && data && data.length > 0 && data[0].reference) {
    const lastSeq = parseInt(data[0].reference.split('-')[2], 10);
    if (!isNaN(lastSeq)) nextSeq = lastSeq + 1;
  }

  return `${prefix}${String(nextSeq).padStart(3, '0')}`;
}

document.addEventListener('adminReady', () => {
  isReadOnly = window.ADMIN.access('plans') === 'read';

  if (isReadOnly) {
    document.getElementById('addPlanBtn').style.display = 'none';
  }

  loadPlans();
});

// ---------- TOAST ----------
function showToast(text, type) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.className = 'toast ' + type;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

// ---------- CHARGER LES PLANS ----------
async function loadPlans() {
  const tbody = document.getElementById('plansTableBody');
  const { data, error } = await supabase
    .from('plans')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Erreur de chargement : ${error.message}</td></tr>`;
    return;
  }

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">Aucun plan pour l'instant. Cliquez sur "Ajouter un plan".</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(plan => {
    const img = (plan.images && plan.images.length > 0) ? plan.images[0] : '';
    return `
      <tr data-id="${plan.id}">
        <td style="font-weight:600; letter-spacing:0.5px; color:var(--gold-light);">${escapeHtml(plan.reference || '—')}</td>
        <td>${img ? `<img src="${img}" class="thumb">` : '—'}</td>
        <td>${escapeHtml(plan.titre)}</td>
        <td>${escapeHtml(plan.categorie || '')}</td>
        <td>${Number(plan.prix).toLocaleString('fr-FR')} FCFA</td>
        <td>${plan.surface} m²</td>
        <td><span class="badge ${plan.statut}">${plan.statut === 'actif' ? 'Actif' : 'Inactif'}</span></td>
        <td class="actions-cell">
          ${isReadOnly ? '<span style="color:var(--grey-text); font-size:12px;">Lecture seule</span>' : `
            <button class="icon-btn edit-btn" data-id="${plan.id}">Modifier</button>
            <button class="icon-btn delete-btn" data-id="${plan.id}" style="color:var(--error);">Supprimer</button>
          `}
        </td>
      </tr>
    `;
  }).join('');

  if (!isReadOnly) {
    document.querySelectorAll('.edit-btn').forEach(btn =>
      btn.addEventListener('click', () => openEditModal(btn.dataset.id, data))
    );
    document.querySelectorAll('.delete-btn').forEach(btn =>
      btn.addEventListener('click', () => deletePlan(btn.dataset.id))
    );
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- MODAL ----------
const modal = document.getElementById('planModal');
const form = document.getElementById('planForm');

document.getElementById('addPlanBtn').addEventListener('click', () => openAddModal());
document.getElementById('cancelBtn').addEventListener('click', closeModal);

function openAddModal() {
  form.reset();
  document.getElementById('modalTitle').textContent = 'Ajouter un plan';
  document.getElementById('planId').value = '';
  document.getElementById('referenceGroup').style.display = 'none';
  document.getElementById('reference').value = '';
  currentImages = [];
  newFiles = [];
  renderImagePreviews();
  modal.classList.add('open');
}

function openEditModal(id, plans) {
  const plan = plans.find(p => p.id == id);
  if (!plan) return;

  document.getElementById('modalTitle').textContent = 'Modifier le plan';
  document.getElementById('planId').value = plan.id;
  document.getElementById('referenceGroup').style.display = 'block';
  document.getElementById('reference').value = plan.reference || 'Non générée (ancien plan)';
  document.getElementById('titre').value = plan.titre;
  document.getElementById('description').value = plan.description;
  document.getElementById('prix').value = plan.prix;
  document.getElementById('categorie').value = plan.categorie;
  document.getElementById('surface').value = plan.surface;
  document.getElementById('chambres').value = plan.chambres;
  document.getElementById('statut').value = plan.statut;

  const formats = plan.formats || [];
  document.getElementById('formatPdf').checked = formats.includes('PDF');
  document.getElementById('formatDwg').checked = formats.includes('DWG');

  currentImages = plan.images ? [...plan.images] : [];
  newFiles = [];
  renderImagePreviews();

  modal.classList.add('open');
}

function closeModal() {
  modal.classList.remove('open');
}

// ---------- GESTION IMAGES ----------
document.getElementById('imagesInput').addEventListener('change', (e) => {
  newFiles = [...newFiles, ...Array.from(e.target.files)];
  renderImagePreviews();
});

function renderImagePreviews() {
  const list = document.getElementById('imagePreviewList');
  let html = '';

  currentImages.forEach((url, i) => {
    html += `<div class="image-preview-item">
      <img src="${url}">
      <button type="button" class="remove-img" data-type="existing" data-index="${i}">×</button>
    </div>`;
  });

  newFiles.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    html += `<div class="image-preview-item">
      <img src="${url}">
      <button type="button" class="remove-img" data-type="new" data-index="${i}">×</button>
    </div>`;
  });

  list.innerHTML = html;

  list.querySelectorAll('.remove-img').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.index);
      if (btn.dataset.type === 'existing') {
        currentImages.splice(idx, 1);
      } else {
        newFiles.splice(idx, 1);
      }
      renderImagePreviews();
    });
  });
}

// ---------- SAUVEGARDE (ADD / EDIT) ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Enregistrement...';

  try {
    // 1. Upload des nouvelles images
    const uploadedUrls = [];
    for (const file of newFiles) {
      const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { error: uploadError } = await supabase.storage
        .from(BUCKET)
        .upload(fileName, file);

      if (uploadError) throw uploadError;

      const { data: publicUrlData } = supabase.storage
        .from(BUCKET)
        .getPublicUrl(fileName);

      uploadedUrls.push(publicUrlData.publicUrl);
    }

    const allImages = [...currentImages, ...uploadedUrls];

    const formats = [];
    if (document.getElementById('formatPdf').checked) formats.push('PDF');
    if (document.getElementById('formatDwg').checked) formats.push('DWG');

    const planData = {
      titre: document.getElementById('titre').value.trim(),
      description: document.getElementById('description').value.trim(),
      prix: parseFloat(document.getElementById('prix').value),
      categorie: document.getElementById('categorie').value,
      surface: parseFloat(document.getElementById('surface').value),
      chambres: parseInt(document.getElementById('chambres').value),
      formats: formats,
      images: allImages,
      statut: document.getElementById('statut').value
    };

    const planId = document.getElementById('planId').value;

    let error;
    if (planId) {
      ({ error } = await supabase.from('plans').update(planData).eq('id', planId));
    } else {
      planData.reference = await generateReference(planData.categorie);
      planData.created_at = new Date().toISOString();
      ({ error } = await supabase.from('plans').insert([planData]));
    }

    if (error) throw error;

    showToast(planId ? 'Plan modifié avec succès.' : 'Plan ajouté avec succès.', 'success');
    closeModal();
    loadPlans();

  } catch (err) {
    console.error(err);
    showToast("Erreur : " + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Enregistrer';
  }
});

// ---------- SUPPRESSION ----------
async function deletePlan(id) {
  if (!confirm('Supprimer ce plan définitivement ? Cette action est irréversible.')) return;

  const { error } = await supabase.from('plans').delete().eq('id', id);

  if (error) {
    showToast("Erreur lors de la suppression : " + error.message, 'error');
    return;
  }

  showToast('Plan supprimé.', 'success');
  loadPlans();
}
</script>

</body>
</html>
