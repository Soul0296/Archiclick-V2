<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Clients — Admin Archiclick</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --gold: #C9A961; --gold-light: #E5D4A8; --black: #0D0D0D;
    --black-soft: #1A1A1A; --black-card: #161616; --grey-text: #A8A8A8;
    --error: #D96C6C; --success: #7FB88A; --border: rgba(201,169,97,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { width:100%; max-width:100%; overflow-x:hidden; }
  body { font-family:'Inter',sans-serif; background:var(--black); color:#fff; display:flex; min-height:100vh; width:100%; max-width:100%; overflow-x:hidden; }
  img, table, canvas { max-width:100%; }

  .sidebar { width:240px; background:var(--black-soft); border-right:1px solid var(--border); padding:28px 0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; overflow-x:hidden; transition:width 0.25s ease; z-index:120; }
  .sidebar .logo { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; text-align:center; letter-spacing:1px; color:var(--gold-light); margin-bottom:32px; padding:0 20px; white-space:nowrap; overflow:hidden; }
  .sidebar .logo span { color:var(--gold); }
  .sidebar .logo .logo-mini-collapsed { display:none; }
  .nav-item { display:flex; align-items:center; padding:12px 24px; color:var(--grey-text); text-decoration:none; font-size:13px; letter-spacing:0.5px; border-left:2px solid transparent; transition:all 0.15s; white-space:nowrap; }
  .nav-item i { width:18px; text-align:center; margin-right:12px; font-size:14px; flex-shrink:0; }
  .nav-item:hover { background:rgba(201,169,97,0.06); color:var(--gold-light); }
  .nav-item.active { color:var(--gold); border-left-color:var(--gold); background:rgba(201,169,97,0.08); }

  .sidebar-collapse-btn {
    display:none; position:absolute; top:24px; right:-13px; width:26px; height:26px;
    background:var(--black-soft); border:1px solid var(--border); border-radius:50%;
    color:var(--gold-light); font-size:11px; cursor:pointer; align-items:center; justify-content:center;
    z-index:10; transition:transform 0.25s ease;
  }
  .sidebar-collapse-btn:hover { border-color:var(--gold); color:var(--gold); }
  @media (min-width:901px) { .sidebar-collapse-btn { display:flex; } }

  .sidebar.collapsed { width:72px; }
  .sidebar.collapsed .logo .logo-full { display:none; }
  .sidebar.collapsed .logo .logo-mini-collapsed { display:inline; }
  .sidebar.collapsed .logo { padding:0; }
  .sidebar.collapsed .nav-item { padding:12px 0; justify-content:center; }
  .sidebar.collapsed .nav-item i { margin-right:0; font-size:16px; }
  .sidebar.collapsed .nav-text { display:none; }
  .sidebar.collapsed .sidebar-collapse-btn { transform:rotate(180deg); }

  .main { margin-left:240px; flex:1; padding:32px 40px; min-width:0; max-width:100%; transition:margin-left 0.25s ease; }
  body.sidebar-collapsed .main { margin-left:72px; }
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .page-header h1 { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; }

  .search-bar { margin-bottom:20px; }
  .search-bar input { width:100%; max-width:340px; background:var(--black-card); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:2px; font-size:13px; }
  .search-bar input:focus { outline:none; border-color:var(--gold); }

  .btn { padding:11px 22px; border-radius:2px; border:none; font-size:13px; font-weight:600; letter-spacing:0.5px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-gold { background:var(--gold); color:var(--black); }
  .btn-gold:hover { background:var(--gold-light); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--grey-text); }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold-light); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .table-wrap { background:var(--black-card); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:14px 16px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); border-bottom:1px solid var(--border); background:rgba(201,169,97,0.04); }
  td { padding:14px 16px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.05); color:#ddd; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,255,255,0.02); }

  .icon-btn { background:none; border:1px solid var(--border); color:var(--grey-text); padding:6px 10px; border-radius:2px; cursor:pointer; font-size:12px; }
  .icon-btn:hover { color:var(--gold-light); border-color:var(--gold); }
  .empty-state { text-align:center; padding:50px 20px; color:var(--grey-text); }

  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--black-soft); border:1px solid var(--border); border-radius:4px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:32px; }
  .modal h2 { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold-light); margin-bottom:20px; }

  .form-group { margin-bottom:16px; }
  label { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); margin-bottom:6px; }
  input, textarea { width:100%; background:#000; border:1px solid rgba(255,255,255,0.15); color:#fff; padding:10px 12px; font-family:'Inter',sans-serif; font-size:13px; border-radius:2px; }
  input:focus, textarea:focus { outline:none; border-color:var(--gold); }
  textarea { resize:vertical; min-height:60px; }

  .history-box { margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
  .history-box h3 { font-size:13px; color:var(--gold-light); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }
  .history-item { font-size:12px; color:#ccc; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; }

  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--black-soft); border:1px solid var(--border); padding:14px 20px; border-radius:4px; font-size:13px; z-index:200; display:none; }
  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error { border-color:var(--error); color:var(--error); }

  /* ==================== RESPONSIVE MOBILE/TABLETTE ==================== */
  .mobile-topbar { display:none; }
  .sidebar-overlay { display:none; }

  .page-header, .search-bar, .modal-actions, .history-item { min-width:0; }

  @media (max-width: 1024px) {
    .main { padding:28px 24px; }
  }

  @media (max-width: 900px) {
    .mobile-topbar {
      display:flex; align-items:center; justify-content:space-between;
      position:fixed; top:0; left:0; right:0; height:56px;
      background:var(--black-soft); border-bottom:1px solid var(--border);
      padding:0 16px; z-index:150;
    }
    .mobile-topbar .logo-mini { font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold-light); }
    .mobile-topbar .logo-mini span { color:var(--gold); }
    .menu-toggle-btn { background:none; border:1px solid var(--border); color:var(--gold-light); padding:8px 12px; border-radius:3px; font-size:15px; cursor:pointer; }

    .sidebar { width:80%; max-width:280px; transform:translateX(-100%); transition:transform 0.3s ease; top:56px; z-index:140; }
    .sidebar.open { transform:translateX(0); }
    .sidebar.collapsed { width:80%; max-width:280px; }
    .sidebar.collapsed .logo .logo-full { display:inline; }
    .sidebar.collapsed .logo .logo-mini-collapsed { display:none; }
    .sidebar.collapsed .nav-item { padding:12px 24px; justify-content:flex-start; }
    .sidebar.collapsed .nav-item i { margin-right:12px; }
    .sidebar.collapsed .nav-text { display:inline; }

    .sidebar-overlay.open {
      display:block; position:fixed; top:56px; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.6); z-index:130;
    }

    body.sidebar-collapsed .main { margin-left:0; }
    .main { margin-left:0 !important; padding:72px 16px 24px !important; width:100%; }

    .page-header { flex-wrap:wrap; gap:10px; }
    .page-header h1 { font-size:22px; }
    .search-bar input { max-width:100%; }

    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { min-width:640px; }

    .modal { padding:20px; max-height:88vh; }
    .modal-actions { flex-wrap:wrap; }
    .modal-actions .btn { flex:1 1 auto; }
    .history-item { flex-wrap:wrap; gap:4px; }

    .toast { left:16px; right:16px; bottom:16px; }
  }

  @media (max-width: 480px) {
    .page-header h1 { font-size:20px; }
    .page-header .btn { width:100%; }
    .modal { padding:16px; }
    .modal h2 { font-size:20px; }
  }

</style>
</head>
<body>

<div class="mobile-topbar">
  <div class="logo-mini">Archi<span>click</span></div>
  <button class="menu-toggle-btn" id="menuToggleBtn">☰ Menu</button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toggleBtn = document.getElementById('menuToggleBtn');
  var overlay = document.getElementById('sidebarOverlay');
  var sidebar = document.querySelector('.sidebar');
  if (toggleBtn) toggleBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); overlay.classList.toggle('open'); });
  if (overlay) overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  document.querySelectorAll('.sidebar .nav-item').forEach(function(link) {
    link.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  });

  /* Rétractation de la sidebar (icônes seules), état mémorisé */
  var collapseBtn = document.getElementById('sidebarCollapseBtn');
  var isCollapsed = localStorage.getItem('archiclick_sidebar_collapsed') === '1';
  function applyCollapsedState() {
    sidebar.classList.toggle('collapsed', isCollapsed);
    document.body.classList.toggle('sidebar-collapsed', isCollapsed);
  }
  applyCollapsedState();
  if (collapseBtn) {
    collapseBtn.addEventListener('click', function() {
      isCollapsed = !isCollapsed;
      localStorage.setItem('archiclick_sidebar_collapsed', isCollapsed ? '1' : '0');
      applyCollapsedState();
    });
  }
});
</script>

<div class="sidebar" id="sidebar">
  <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Réduire / agrandir le menu"><i class="fas fa-angle-left"></i></button>
  <div class="logo"><span class="logo-full">Archi<span>click</span></span><span class="logo-mini-collapsed">A<span>c</span></span></div>
  <a href="dashboard.html" class="nav-item" data-page="dashboard" title="Tableau de bord"><i class="fas fa-gauge-high"></i><span class="nav-text">Tableau de bord</span></a>
  <a href="db-plans.html" class="nav-item" data-page="plans" title="Plans"><i class="fas fa-drafting-compass"></i><span class="nav-text">Plans</span></a>
  <a href="db-commandes.html" class="nav-item" data-page="commandes" title="Commandes"><i class="fas fa-receipt"></i><span class="nav-text">Commandes</span></a>
  <a href="db-clients.html" class="nav-item active" data-page="clients" title="Clients"><i class="fas fa-users"></i><span class="nav-text">Clients</span></a>
  <a href="db-avis.html" class="nav-item" data-page="avis" title="Avis clients"><i class="fas fa-star"></i><span class="nav-text">Avis clients</span></a>
  <a href="db-demandes.html" class="nav-item" data-page="demandes" title="Demandes sur mesure"><i class="fas fa-pen-ruler"></i><span class="nav-text">Demandes sur mesure</span></a>
  <a href="db-promos.html" class="nav-item" data-page="promos" title="Codes Promo"><i class="fas fa-ticket"></i><span class="nav-text">Codes Promo</span></a>
  <a href="db-blog.html" class="nav-item" data-page="blog" title="Blog"><i class="fas fa-newspaper"></i><span class="nav-text">Blog</span></a>
  <a href="db-comptabilite.html" class="nav-item" data-page="comptabilite" title="Comptabilité"><i class="fas fa-calculator"></i><span class="nav-text">Comptabilité</span></a>
  <a href="db-taches.html" class="nav-item" data-page="taches" title="Tâches"><i class="fas fa-list-check"></i><span class="nav-text">Tâches</span></a>
  <a href="db-parametres.html" class="nav-item" data-page="parametres" title="Paramètres"><i class="fas fa-gear"></i><span class="nav-text">Paramètres</span></a>
  <a href="db-admins.html" class="nav-item" data-page="admins" title="Gestion des admins"><i class="fas fa-user-shield"></i><span class="nav-text">Gestion des admins</span></a>
  <a href="#" id="logoutBtn" class="nav-item" style="margin-top:20px; color:var(--error);" title="Déconnexion"><i class="fas fa-arrow-right-from-bracket"></i><span class="nav-text">Déconnexion</span></a>
</div>

<div class="main">
  <div class="page-header">
    <h1>Gestion des Clients</h1>
    <button class="btn btn-gold" id="addClientBtn">+ Ajouter un client</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher par nom ou email...">
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Commandes</th><th>Actions</th></tr></thead>
      <tbody id="clientsTableBody"><tr><td colspan="5" class="empty-state">Chargement...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <h2 id="modalTitle">Ajouter un client</h2>
    <form id="clientForm">
      <input type="hidden" id="clientId">
      <div class="form-group"><label>Nom complet</label><input type="text" id="nom" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label>Téléphone</label><input type="text" id="telephone" required></div>
      <div class="form-group"><label>Adresse</label><textarea id="adresse"></textarea></div>

      <div class="history-box" id="historyBox" style="display:none;">
        <h3>Historique des commandes</h3>
        <div id="historyList"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn btn-gold" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/supabase.js"></script>
<script src="../js/permissions.js"></script>
<script src="../js/auth-guard.js"></script>
<script>
let allClients = [];
let isReadOnly = false;

document.addEventListener('adminReady', () => {
  isReadOnly = window.ADMIN.access('clients') === 'read';
  if (isReadOnly) document.getElementById('addClientBtn').style.display = 'none';
  loadClients();
});

function showToast(text, type) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }

document.getElementById('searchInput').addEventListener('input', (e) => renderClients(e.target.value.toLowerCase()));

// ---------- CHARGEMENT ----------
// "commandes" ne référence pas clients.id — le client y est stocké directement
// (client_nom, client_email, client_tel). On relie donc l'historique par email.
async function loadClients() {
  const [{ data: clients, error }, { data: commandes }] = await Promise.all([
    supabase.from('clients').select('*').order('nom', { ascending: true }),
    supabase.from('commandes').select('id, client_email, montant_total, date_commande, statut')
  ]);

  if (error) {
    document.getElementById('clientsTableBody').innerHTML = `<tr><td colspan="5" class="empty-state">Erreur : ${error.message}</td></tr>`;
    return;
  }

  const commandesByEmail = {};
  (commandes || []).forEach(cmd => {
    const key = (cmd.client_email || '').toLowerCase();
    if (!key) return;
    if (!commandesByEmail[key]) commandesByEmail[key] = [];
    commandesByEmail[key].push(cmd);
  });

  allClients = (clients || []).map(c => ({ ...c, commandes: commandesByEmail[(c.email || '').toLowerCase()] || [] }));
  renderClients('');
}

function renderClients(search) {
  const tbody = document.getElementById('clientsTableBody');
  const filtered = allClients.filter(c =>
    !search || (c.nom || '').toLowerCase().includes(search) || (c.email || '').toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun client trouvé.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(c => `
    <tr>
      <td>${escapeHtml(c.nom)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td>${escapeHtml(c.telephone)}</td>
      <td>${c.commandes.length}</td>
      <td>
        <button class="icon-btn view-btn" data-id="${c.id}">${isReadOnly ? 'Voir' : 'Modifier'}</button>
        ${!isReadOnly ? `<button class="icon-btn delete-btn" data-id="${c.id}" style="color:var(--error);">Supprimer</button>` : ''}
      </td>
    </tr>
  `).join('');

  document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
  document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteClient(btn.dataset.id)));
}

const modal = document.getElementById('clientModal');
const form = document.getElementById('clientForm');

document.getElementById('addClientBtn').addEventListener('click', () => {
  form.reset();
  document.getElementById('modalTitle').textContent = 'Ajouter un client';
  document.getElementById('clientId').value = '';
  document.getElementById('historyBox').style.display = 'none';
  [...form.elements].forEach(el => { if (el.tagName !== 'BUTTON') el.disabled = false; });
  modal.classList.add('open');
});

document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('open'));

function openModal(id) {
  const client = allClients.find(c => c.id == id);
  if (!client) return;

  document.getElementById('modalTitle').textContent = isReadOnly ? 'Détail du client' : 'Modifier le client';
  document.getElementById('clientId').value = client.id;
  document.getElementById('nom').value = client.nom || '';
  document.getElementById('email').value = client.email || '';
  document.getElementById('telephone').value = client.telephone || '';
  document.getElementById('adresse').value = client.adresse || '';

  [...form.elements].forEach(el => { if (el.tagName !== 'BUTTON') el.disabled = isReadOnly; });

  const commandes = client.commandes || [];
  const historyBox = document.getElementById('historyBox');
  const historyList = document.getElementById('historyList');

  if (commandes.length > 0) {
    historyBox.style.display = 'block';
    historyList.innerHTML = commandes
      .sort((a, b) => new Date(b.date_commande) - new Date(a.date_commande))
      .map(cmd => `
        <div class="history-item">
          <span>${new Date(cmd.date_commande).toLocaleDateString('fr-FR')} — ${cmd.statut}</span>
          <span>${Number(cmd.montant_total).toLocaleString('fr-FR')} FCFA</span>
        </div>
      `).join('');
  } else {
    historyBox.style.display = 'none';
  }

  modal.classList.add('open');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (isReadOnly) return;

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'Enregistrement...';

  const clientData = {
    nom: document.getElementById('nom').value.trim(),
    email: document.getElementById('email').value.trim(),
    telephone: document.getElementById('telephone').value.trim(),
    adresse: document.getElementById('adresse').value.trim()
  };

  const clientId = document.getElementById('clientId').value;
  let error;
  if (clientId) ({ error } = await supabase.from('clients').update(clientData).eq('id', clientId));
  else ({ error } = await supabase.from('clients').insert([clientData]));

  saveBtn.disabled = false; saveBtn.textContent = 'Enregistrer';

  if (error) { showToast("Erreur : " + error.message, 'error'); return; }

  showToast(clientId ? 'Client modifié.' : 'Client ajouté.', 'success');
  modal.classList.remove('open');
  loadClients();
});

async function deleteClient(id) {
  if (!confirm("Supprimer ce client définitivement ?")) return;
  const { error } = await supabase.from('clients').delete().eq('id', id);
  if (error) { showToast("Erreur : " + error.message, 'error'); return; }
  showToast('Client supprimé.', 'success');
  loadClients();
}
</script>

</body>
</html>
